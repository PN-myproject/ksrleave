<title>ระบบลางานออนไลน์ | ခွင့်တင်စနစ်</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EADF; --card:#FFFBF6; --line:#E2D3BF;
  --mocha:#6F4E37; --mocha-d:#4A3222; --mocha-l:#A58467;
  --beige:#E8DCC8; --beige-d:#D7C4A9;
  --txt:#3B2B20; --muted:#8A7665;
  --go:#2E7D4F; --go-d:#1F5C39; --done:#9E9186;
  --warn:#B07A1E; --bad:#B4553F;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans Thai','Noto Sans Myanmar',system-ui,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
h1,h2,h3{font-size:17px;font-weight:700;margin:0 0 10px}
.wrap{max-width:1060px;margin:0 auto;padding:0 12px 80px}
header{background:var(--mocha);color:#FBF5ED;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(74,50,34,.22)}
.hbar{max-width:1060px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;gap:8px}
.logo{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.14);color:#FBF5ED;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 11px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.hbtn:active{background:rgba(255,255,255,.3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(111,78,55,.06)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:13px 0}
label{display:block;font-size:15px;color:var(--muted);margin:0 0 4px}
input,select,textarea,button{font:inherit;font-size:16px;max-width:100%}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--beige-d);border-radius:10px;background:#fff;color:var(--txt);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mocha-l);box-shadow:0 0 0 3px rgba(165,132,103,.18)}
.field{margin-bottom:11px}
.btn{background:var(--mocha);color:#FFF8EF;border:0;border-radius:11px;padding:11px 17px;cursor:pointer;font-weight:600;min-height:46px}
.btn:active{background:var(--mocha-d)}
.btn.sec{background:var(--beige);color:var(--mocha-d);border:1px solid var(--beige-d)}
.btn.go{background:var(--go);box-shadow:0 3px 0 var(--go-d);font-size:17px}
.btn.go:active{background:var(--go-d);box-shadow:none;transform:translateY(2px)}
.btn.done{background:var(--done);box-shadow:none}
.btn.bad{background:var(--bad)}
.btn.sm{padding:7px 12px;min-height:38px;border-radius:9px;font-size:15px;font-weight:400}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.filebox{border:2px dashed var(--beige-d);border-radius:12px;padding:15px;text-align:center;background:#FDF8F1;cursor:pointer;display:block}
.filebox input{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.tab{background:var(--beige);border:1px solid var(--beige-d);color:var(--mocha-d);border-radius:10px;padding:9px 13px;cursor:pointer;white-space:nowrap;font-size:15px}
.tab.on{background:var(--mocha);color:#FFF8EF;border-color:var(--mocha)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
th{background:var(--beige);color:var(--mocha-d);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:15px;border:1px solid}
.p-wait{background:#FBF2E0;color:#8A6520;border-color:#E6D3A8}
.p-ok{background:#E6F0E8;color:#2E7D4F;border-color:#BBD6C2}
.p-no{background:#F8E7E2;color:#8E3B29;border-color:#E6C1B6}
.p-cancel{background:#EEE8E0;color:#7A6A5C;border-color:#DACCBC}
.p-edit{background:#EAE4F3;color:#5A4785;border-color:#CFC4E4}
.p-sh{background:#E5EDF2;color:#3C5F77;border-color:#C2D5E0}
.p-urgent{background:#C62828;color:#fff;border-color:#8E1B1B;font-weight:700}
.p-clear{background:#2E7D32;color:#fff;border-color:#1B5E20;font-weight:700}
.tab.t-urgent{background:#C62828;color:#fff;border-color:#8E1B1B;font-weight:700}
.tab.t-clear{background:#2E7D32;color:#fff;border-color:#1B5E20;font-weight:700}
.tab.t-urgent.on,.tab.t-clear.on{box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.p-new{background:#FFF1D6;color:#8A4B0B;border-color:#F0C27A;white-space:nowrap;font-size:13px;padding:1px 8px}
.qcard{background:#FDF8F1;border:1px solid var(--beige-d);border-radius:12px;padding:11px}
.qname{font-weight:600;margin-bottom:5px;font-size:16px}
.qbig{font-size:17px;font-weight:700;color:var(--mocha)}
.bar{height:7px;background:var(--beige);border-radius:99px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--mocha-l)}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--beige);border:2px solid var(--beige-d);flex:none}
.avatar.big{width:76px;height:76px}
.muted{color:var(--muted);font-size:15px}
.note{background:#FDF8F1;border-left:4px solid var(--mocha-l);padding:9px 12px;border-radius:0 10px 10px 0;font-size:15px}
.alert{border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0}
.a-warn{background:#FCF3E2;border:1px solid #E6D3A8;color:#8A6520}
.a-bad{background:#F8E7E2;border:1px solid #E6C1B6;color:#8E3B29}
.a-info{background:#EAF1F5;border:1px solid #C2D5E0;color:#3C5F77}
.err{color:var(--bad)}.good{color:var(--go)}
details.other{border:1px dashed var(--beige-d);border-radius:11px;padding:9px 12px;background:#FBF6EF}
details.other summary{cursor:pointer;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--mocha-d);color:#FFF8EF;padding:11px 18px;border-radius:12px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.hide{display:none!important}
@media(max-width:760px){
  .wrap{padding:0 10px 80px}
  .tblwrap{overflow:visible;border:0;background:transparent;border-radius:0}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;padding:6px 10px}
  table.rt td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;white-space:normal}
  table.rt td:before{content:attr(data-l);color:var(--muted);font-size:15px;text-align:left;flex:0 0 40%}
  table.rt td.act{justify-content:flex-end;flex-wrap:wrap}
  table.rt td.act:before{flex:0 0 auto}
  table.rt td input,table.rt td select{max-width:58%}
  .btn{width:100%}
  .row .btn,.row .btn.sm{width:auto}
  .hbar{gap:6px}
}
[data-t]{cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .12s}

const SHIFTS={
 normal:{id:'normal',th:'กะปกติ',my:'ပုံမှန်ဆိုင်း',start:'08:00',end:'17:00',hours:8,bs:'11:50',be:'12:50',

         work:[0,1,1,1,1,1,0],daysTh:'จันทร์–ศุกร์',daysMy:'တနင်္လာ–သောကြာ'}
};
const shOf=e=>SHIFTS[e?.shift]||SHIFTS.normal;
const shName=s=>lang==='my'?s.my:s.th;
const shDays=s=>lang==='my'?s.daysMy:s.daysTh;
const isWork=(iso,s)=>{const d=new Date(iso+'T00:00:00');return !isNaN(d)&&s.work[d.getDay()]===1;};
function countWork(a,b,s){let n=0,d=new Date(a+'T00:00:00'),end=new Date(b+'T00:00:00'),g=0;
  while(d<=end&&g++<400){if(s.work[d.getDay()]===1)n++;d.setDate(d.getDate()+1);}return n;}
const toMin=x=>{const p=String(x).split(':');return (+p[0]||0)*60+(+p[1]||0);};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayMin=s=>Math.round(s.hours*60);            /* 1 วันทำงาน = กี่นาที (ตามกะ) */
const r4=x=>Math.round((+x||0)*1e4)/1e4;
const holOf=d=>(DB.holidays||[]).find(h=>h.date===d);
const isWorkDay=(d,s)=>isWork(d,s)&&!holOf(d);      /* วันทำงานของกะ และไม่ใช่วันหยุดประเพณี */
const WD={th:['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'],
 my:['တနင်္ဂနွေ','တနင်္လာ','အင်္ဂါ','ဗုဒ္ဓဟူး','ကြာသပတေး','သောကြာ','စနေ']};
const wdName=d=>(WD[lang]||WD.th)[new Date(d+'T00:00:00').getDay()]||'';
function fmtDur(m,dm){m=Math.round(m);const neg=m<0;m=Math.abs(m);
  const d=Math.floor(m/dm),r=m%dm,h=Math.floor(r/60),n=r%60,p=[];
  if(d)p.push(d+' '+t('day'));if(h)p.push(h+' '+t('hrs'));if(n)p.push(n+' '+t('mins'));
  return (neg?'−':'')+(p.join(' ')||'0 '+t('day'));}
const fmtDays=(e,x)=>{const dm=dayMin(shOf(e));return fmtDur((+x||0)*dm,dm);};
const reqSh=r=>SHIFTS[r.shift]||shOf(empById(r.empId));
const reqMins=r=>r.mins!=null?r.mins:Math.round((+r.days||0)*dayMin(reqSh(r)));
const durTxt=r=>fmtDur(reqMins(r),r.dm||dayMin(reqSh(r)));
const splitDur=r=>{const dm=r.dm||dayMin(reqSh(r)),m=reqMins(r);return[Math.floor(m/dm),Math.floor(m%dm/60),m%dm%60];};
/* พักกลางวัน 11:50-12:50 (กำหนดที่ bs/be ในแต่ละกะ) ; offset = นาทีทำงานนับจากเริ่มกะ */
const brkOf=s=>toMin(s.be)-toMin(s.bs),preOf=s=>toMin(s.bs)-toMin(s.start);
const mm=x=>String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(Math.round(x%60)).padStart(2,'0');
const clk=(s,o,st)=>{const h=preOf(s);return mm(toMin(s.start)+((o<h||(o===h&&!st))?o:o+brkOf(s)));};
const offOf=(s,c)=>{const h=preOf(s),b=brkOf(s),x=toMin(c)-toMin(s.start);return Math.min(dayMin(s),Math.max(0,x<=h?x:x<=h+b?h:x-b));};
/* เริ่มวันที่ a (offset o0 ในวันแรก) นับเวลาลา total นาที ข้ามวันหยุดกะ/วันหยุดประเพณี → วันสุดท้าย + offset สิ้นสุด */
function planLeave(a,total,s,o0=0){const dm=dayMin(s),cur=new Date(a+'T00:00:00');let rem=total,end=a,eo=0,first=true,g=0;const hol=[];
  while(rem>0&&g++<1500){const k=iso(cur);
    if(isWorkDay(k,s)){const st=first?o0:0,take=Math.min(rem,dm-st);first=false;if(take>0){end=k;eo=st+take;rem-=take;}}
    else if(isWork(k,s)&&holOf(k))hol.push(holOf(k));
    cur.setDate(cur.getDate()+1);}
  return{end,hol,eo};}

  if(v[0]==='h')return +v.slice(1);

function calcLeave(){
  const e=S.user,sh=shOf(e),off=$('#f_off'),a=$('#f_from')?.value;if(!off||!a)return null;
  $('#f_cust').style.display=$('#f_dur').value==='c'?'grid':'none';$('#f_st').disabled=$('#f_sm').value!=='t';
  {const sm=$('#f_sm').value;if(sm!=='t')$('#f_st').value=sm==='pm'?clk(sh,preOf(sh),true):sh.start;}
  const total=readDur(),dm=dayMin(sh);
  if(!isWorkDay(a,sh)){off.innerHTML=`<div class="alert a-warn">${t('startOff')}${holOf(a)?' — '+esc(holOf(a).th):''}</div>`;return null;}
  if(total<=0){off.innerHTML=`<div class="alert a-warn">${t('zeroDur')}</div>`;return null;}
  const vv=$('#f_dur').value,o00=startOff(sh);
  if((vv==='c'||vv[0]==='h')&&total<dm&&total>dm-o00){off.innerHTML=`<div class="alert a-bad">เวลาที่ลา (${fmtDur(total,dm)}) เกินเวลาเลิกงานของวันนั้น — เหลือเวลาทำงานนับจากเวลาเริ่มนี้ ${fmtDur(dm-o00,dm)} กรุณาเลือกเวลาเริ่มให้เร็วขึ้น หรือยื่นแยกเป็น 2 ใบลา</div>`;return null;}
  const o0=startOff(sh),p=planLeave(a,readSess(total),sh,o0),ty=typeById($('#f_type').value),tf=clk(sh,o0,true),tt=clk(sh,p.eo,false);
  let h=`<b>${fmtDur(total,dm)}</b><br>${fmtD(a)} ${tf} → ${fmtD(p.end)} ${tt}`;
  if(ty&&!ty.hideQ)h+=`<br>${t('after')}: ${fmtDur(leftMin(e,ty)-total,dm)}`;
  if(p.hol.length)h+=`<br>${t('skipHol')}: ${p.hol.map(x=>fmtD(x.date)+' '+esc(lang==='my'&&x.my?x.my:x.th)).join(', ')}`;
  const dp=dupOf(e.id,sh,a,p.end,tf,tt);
  off.innerHTML=`<div class="alert ${dp?'a-bad':'a-info'}">${h}${dp?`<br><b>${t('dupLeave')}: #${dp.r.no} ${fmtD(dp.date)}</b>`:''}</div>`;
  return{total,end:p.end,tf,tt,dp};
}
function submitReq(){

    shift:sh.id,sickDoc:isSick(ty)?SICK:'',...(()=>{const n=effSteps(e),sk=n===2&&selfHead(e);return{steps:n,stage:n===2&&!sk?'head':'mgr',...(sk?{skipHead:true}:{})};})(),status:'wait',note:'',createdAt:new Date().toISOString(),by:'',at:'',edited:false,edits:[]});

const apvIn=(e,lv)=>DB.approvers.filter(a=>lvlOf(a)===lv&&inScope(a,e));

const isCx=r=>r.status==='appr'&&!!r.cx&&r.cx.st==='wait';

const canReqCx=r=>r.status==='appr'&&!isCx(r)&&!!r.from&&r.from>=today();

const canAct=(a,r)=>{if(r.status!=='wait'&&!isCx(r))return false;const e=empById(r.empId);return !!e&&inScope(a,e)&&lvlOf(a)===curStage(r);};
const cxTag=r=>{const c=r.cx;if(!c)return'';
  const chain=[c.skipHead?t('skipHead'):c.headBy,c.by].filter(Boolean).join(' → ');

      (c.headBy?`<div class="muted">✅ ${t('lvlHead')}: ${esc(c.headBy)}${c.headNote?' — '+esc(c.headNote):''}</div>`:'')+(c.skipHead?`<div class="muted">↪ ${t('skipHeadNote')}</div>`:'');}

function reqCancel(id){const e=S.user,r=DB.requests.find(x=>x.id===id);

function decideCx(r,st,a,note,e,now){const c=r.cx;

function decide(id,st){const r=DB.requests.find(x=>x.id===id);if(!r)return;
  const a=DB.approvers.find(x=>x.id===S.user.id)||S.user;
  if(!canAct(a,r)){toast(t('noPerm'));render();return;}
  const note=prompt(t('note'))||'',e=empById(r.empId),now=new Date().toISOString();
  if(isCx(r)){decideCx(r,st,a,note,e,now);return;}
  if(st==='appr'&&reqStage(r)==='head'){ /* ขั้นหัวหน้า: ส่งต่อให้ผู้จัดการ */
    r.stage='mgr';r.headBy=a.name;r.headAt=now;r.headNote=note;lineAfterHead(r);save();toast(t('headOK'));render();return;}
  if(st==='appr'&&e){e.q||={};e.q[r.typeId]||={quota:0,used:0};
    e.q[r.typeId].used=(+e.q[r.typeId].used||0)+(+r.days||0);}
  r.status=st;r.note=note;r.by=a.name;r.at=now;save();toast(t('saved'));render();}

function readSheet(file){return new Promise((res,rej)=>{const fr=new FileReader();
  fr.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});
    res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));}catch(e){rej(e);}};
  fr.onerror=rej;fr.readAsArrayBuffer(file);});}

  return (s.includes('3')||s.includes('shift3')||s.includes('ဆိုင်း၃'))?'shift3':'normal';};

  try{const rows=await readSheet(f);if(!rows.length){box.innerHTML=`<p class="err">${t('none')}</p>`;return;}
    const heads=Object.keys(rows[0]);

const START_RE=/(start\s*work|start\s*date|เริ่มงาน)/i;
function parseDateAny(v){
  const ok=(y,m,d)=>{if(y>2400)y-=543;if(y<1900||y>2100||m<1||m>12||d<1||d>31)return'';const x=new Date(y,m-1,d);if(x.getMonth()!==m-1)return'';
    return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');};
  if(v instanceof Date)return isNaN(v)?'':ok(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){if(v<1||v>80000)return'';const x=new Date(Math.round((v-25569)*86400000));return ok(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate());}
  const s=String(v??'').trim();if(!s)return'';
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return ok(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(m)return ok(+m[3],+m[2],+m[1]);
  if(/^\d{5}$/.test(s))return parseDateAny(+s);
  return'';}

function shrink(file,max){return new Promise(res=>{const fr=new FileReader();
  fr.onload=e=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78));};img.src=e.target.result;};
  fr.readAsDataURL(file);});}

let F={d1:'',d2:'',emp:'',div:'',unit:'',st:'',pd:''};
function filtered(){return DB.requests.slice().sort((a,b)=>b.no-a.no).filter(r=>{const e=empById(r.empId)||{};

const PAYMAP={'พักร้อน':0,'ลาป่วย':1,'ลาคลอด':2,'ลากิจ-ไม่รับเงิน':3,'ลาภัยพิบัติ':4,'บวช':5,'งานศพ':6,'ลากิจ':7,'ลาตรวจครรภ์':8,'พักงาน':9};
const xser=d=>Math.round((Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-Date.UTC(1899,11,30))/864e5);
/* ส่งออกตาม Template_Import_Payday.xls: 1 แถว/วันทำงาน, เฉพาะใบลาที่อนุมัติ (และยังไม่ Key เว้นแต่กรอง "Key แล้ว") */
function exportPayday(){
  const list=filtered().filter(r=>r.status==='appr'&&(F.pd==='y'||!r.pd)).reverse();
  if(!list.length){toast('ไม่มีใบลาที่อนุมัติและยังไม่ Key ในตัวกรองนี้');return;}
  const rows=[],errs=[],okIds=[];
  list.forEach(r=>{const e=empById(r.empId),ty=typeById(r.typeId),sh=reqSh(r),er=m=>errs.push(`#${r.no} ${e?e.name:r.empId}: ${m}`);
    if(isCx(r))return er('มีคำขอยกเลิกรออนุมัติ — ข้ามไว้ก่อน');
    if(!e||!String(r.empId).trim())return er('ไม่พบรหัสพนักงาน');
    const pc=ty&&((ty.pay!=null&&ty.pay!=='')?ty.pay:PAYMAP[String(ty.th).trim()]);
    if(pc==null)return er(`ประเภท "${ty?ty.th:r.typeId}" ไม่มีรหัส Payday`);
    const dup=dupOf(r.empId,sh,r.from,r.to,r.tFrom,r.tTo,r.id);if(dup)return er(`ลาซ้ำกับใบ #${dup.r.no} (${fmtD(dup.date)})`);
    const sg=segsOf(sh,r.from,r.to,r.tFrom,r.tTo).filter(x=>x[2]>x[1]);
    if(!sg.length)return er('ไม่มีวันทำงานในช่วงที่ลา (ตรงวันหยุด)');
    const dm=dayMin(sh),pre=preOf(sh),sum=sg.reduce((a,x)=>a+x[2]-x[1],0);
    if(Math.abs(sum-reqMins(r))>Math.abs(dm/2-pre)+1)return er(`ระยะเวลาไม่ตรงกัน (ในใบลา ${fmtDur(reqMins(r),dm)} / คำนวณได้ ${fmtDur(sum,dm)}) กรุณาเปิดแก้ไขใบลา`);
    sg.forEach(([k,lo,hi])=>{let st,dy='',mn='',tm='';
      if(lo===0&&hi===dm){st=0;dy=1;}else if(lo===0&&hi===pre){st=0;dy=0.5;}else if(lo===pre&&hi===dm){st=1;dy=0.5;}
      else{st=lo===0?0:2;mn=Math.round(hi-lo);if(st===2)tm=clk(sh,lo,true);}
      rows.push([String(r.empId),xser(k),st,tm,dy,'',mn,pc,r.reason||'']);});
    okIds.push(r.id);});
  if(errs.length&&!confirm(`พบ ${errs.length} ใบที่ส่งออกไม่ได้:\n`+errs.slice(0,12).join('\n')+`\n\nส่งออกเฉพาะ ${okIds.length} ใบที่ถูกต้อง?`))return;
  if(!rows.length){toast('ไม่มีรายการที่ส่งออกได้');return;}
  const ws=XLSX.utils.aoa_to_sheet([['EmpID','StartDate','StartType','StartTime','LeaveDays','LeaveHours','LeaveMinutes','LeaveType','Reason'],...rows]);
  rows.forEach((_,i)=>{const c=ws['B'+(i+2)];if(c)c.z='dd/mm/yyyy';});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'PayDay Salary Data');
  XLSX.writeFile(wb,`Payday_Import_${stamp()}.xls`,{bookType:'biff8'});
  if(okIds.length&&confirm(`ทำเครื่องหมาย "Key Payday แล้ว" ให้ใบลาที่ส่งออก ${okIds.length} ใบ?`)){DB.requests.forEach(r=>{if(okIds.includes(r.id))r.pd=true;});save();render();}}

function erCalc(){const e=empById($('#er_emp').value);if(!e)return null;const sh=SHIFTS[$('#er_sh').value]||shOf(e),a=$('#er_f').value;if(!a)return null;
  const v=$('#er_dur').value,sm=$('#er_sm').value;
  $('#er_cu').style.display=v==='c'?'grid':'none';$('#er_stt').disabled=sm!=='t';
  if(sm!=='t')$('#er_stt').value=sm==='pm'?clk(sh,preOf(sh),true):sh.start;
  const total=durMins(v,[+$('#er_dd').value||0,+$('#er_dh').value||0,+$('#er_dm').value||0],sh);
  const o0=sm==='am'?0:sm==='pm'?preOf(sh):offOf(sh,$('#er_stt').value||sh.start);
  const p=total>0?planLeave(a,sessMins(v,sm,total,sh),sh,o0):{end:a,eo:o0};
  const c={total,end:p.end,tf:clk(sh,o0,true),tt:clk(sh,p.eo,false),dm:dayMin(sh),over:(v==='c'||v[0]==='h')&&total<dayMin(sh)&&total>dayMin(sh)-o0};
  $('#er_t').value=c.end;$('#er_ttm').value=c.tt;return c;}
function saveReq(id){
  const r=DB.requests.find(x=>x.id===id);if(!r)return;
  const old={ty:r.typeId,f:r.from,t:r.to,d:r.days,st:r.status};
  const c=erCalc();if(!c||c.total<=0){toast(t('zeroDur'));return;}
  if(c.over){toast('เวลาที่ลาเกินเวลาเลิกงานของวันนั้น');return;}
  const dm=c.dm,nm=Math.round(c.total);
  if(['wait','appr'].includes($('#er_st').value)){const dp=dupOf(r.empId,SHIFTS[r.shift]||shOf(empById(r.empId)),$('#er_f').value,c.end,c.tf,c.tt,r.id);
    if(dp){toast(`${t('dupLeave')}: #${dp.r.no} ${fmtD(dp.date)}`);return;}}
  const nv={ty:$('#er_ty').value,f:$('#er_f').value,t:c.end,d:+(nm/dm).toFixed(6),st:$('#er_st').value};
  if(old.st==='appr'&&nv.st==='can'){r.cxAA=true;r.pd=true;}else if(nv.st!=='can')delete r.cxAA;
  const e=empById(r.empId);
  if(e){if(old.st==='appr'&&e.q?.[old.ty])e.q[old.ty].used=Math.max(0,(+e.q[old.ty].used||0)-(+old.d||0));
    if(nv.st==='appr'){e.q||={};e.q[nv.ty]||={quota:0,used:0};e.q[nv.ty].used=(+e.q[nv.ty].used||0)+nv.d;}}
  const ch=[];
  if(old.ty!==nv.ty)ch.push(t('type'));
  if(old.f!==nv.f||old.t!==nv.t)ch.push(t('period'));
  if(Math.round(old.d*dm)!==nm)ch.push(`${t('dur')} ${fmtDur(old.d*dm,dm)}→${fmtDur(nm,dm)}`);
  if(old.st!==nv.st)ch.push(`${t('status')} ${t(old.st)}→${t(nv.st)}`);
  Object.assign(r,{typeId:nv.ty,from:nv.f,to:nv.t,days:nv.d,status:nv.st,
    mins:nm,dm,tFrom:c.tf,tTo:c.tt,reason:$('#er_r').value,note:$('#er_n').value});
  if(ch.length){r.edited=true;r.edits=(r.edits||[]).concat([{by:'Admin',at:new Date().toISOString(),what:ch.join(', ')}]);}
  save();toast(t('saved'));render();
}
function delReq(id){if(!confirm(t('confirm')))return;const r=DB.requests.find(x=>x.id===id);
  if(r&&r.status==='appr'){const e=empById(r.empId);
    if(e?.q?.[r.typeId])e.q[r.typeId].used=Math.max(0,(+e.q[r.typeId].used||0)-(+r.days||0));}
  DB.requests=DB.requests.filter(x=>x.id!==id);save();toast(t('deleted'));render();}

    DB.types.forEach(ty=>{const q=quotaOf(e,ty.id);
      if(ty.hideQ)o[ty.th+' Used']=r4(q.used);
      else{o[ty.th+' Quota']=q.quota;o[ty.th+' Used']=r4(q.used);o[ty.th+' Available']=r4(q.avail);o[ty.th+' คงเหลือ']=fmtDays(e,q.avail);}});

      'กะ':(SHIFTS[r.shift]||shOf(e)).th,'ประเภทการลา':(typeById(r.typeId)||{}).th||r.typeId,'เอกสารลาป่วย':r.sickDoc&&SICKT[r.sickDoc]?L.th[SICKT[r.sickDoc][0]]:'',
      'เหตุผลขอยกเลิก':r.cx?r.cx.reason:'','วันที่ขอยกเลิก':r.cx?fmtDT(r.cx.at):'','ผลการขอยกเลิก':r.cx?({wait:'รออนุมัติ',appr:'อนุมัติยกเลิก',rej:'ไม่อนุมัติยกเลิก'}[r.cx.st]||''):'','ผู้อนุมัติยกเลิก':r.cx?[r.cx.skipHead?'ข้ามขั้นหัวหน้า':r.cx.headBy,r.cx.by].filter(Boolean).join(' → '):'','วันที่อนุมัติยกเลิก':r.cx&&r.cx.doneAt?fmtDT(r.cx.doneAt):'',
      'วันที่เริ่ม':fmtD(r.from),'เวลาเริ่ม':r.tFrom||'','วันที่สิ้นสุด':fmtD(r.to),'เวลาสิ้นสุด':r.tTo||'',
      'จำนวนวัน':Math.round((+r.days||0)*1e3)/1e3,'ระยะเวลาลา':durTxt(r),'เหตุผล':r.reason||'','สถานะ':{wait:'รออนุมัติ',appr:'อนุมัติ',rej:'ไม่อนุมัติ',can:'ยกเลิก'}[r.status],
      'ผู้อนุมัติ':apvChain(r),'แก้ไขแล้ว':r.edited?'ใช่':'','หมายเหตุ':r.note||'','ยื่นเมื่อ':fmtD(r.createdAt),'Key Payday แล้ว':r.pd?'ใช่':''};});

    <button class="btn bad" onclick="newYear()">เริ่มปีสิทธิ์ใหม่</button></div>
  ${delPeriodCard()}
  <div class="card"><h2>${t('sys')}</h2><p class="note">${t('wipeWarn')} — ${t('storage')}: ${kb} KB</p>
    <div class="row"><button class="btn sec" onclick="wipe('req')">${t('wipeReq')}</button>
      <button class="btn sec" onclick="wipe('emp')">${t('wipeEmp')}</button>
      <button class="btn bad" onclick="wipe('all')">${t('wipeAll')}</button></div></div>`;}
function yrBanner(){const y=new Date().getFullYear();if(DB.quotaYear>=y)return '';
  return `<div class="alert a-warn" style="margin-top:10px">ปีสิทธิ์ยังเป็น <b>${DB.quotaYear}</b> แต่ตอนนี้ปี ${y} แล้ว — สิทธิ์การลายังไม่เริ่มใหม่ <button class="btn sm" onclick="S.tab='sys';render()">ไปที่ตั้งค่าระบบ</button></div>`;}
function newYear(){const y=+$('#ny_y').value,m=$('#ny_m').value;
  if(!y||y<2000||y>2200){toast('ระบุปีให้ถูกต้อง');return;}
  if(y<=DB.quotaYear&&!confirm(`ปีสิทธิ์ปัจจุบันคือ ${DB.quotaYear} ปี ${y} ไม่ใหม่กว่า ต้องการทำซ้ำหรือไม่?`))return;
  const pend=DB.requests.filter(r=>r.status==='wait').length;
  if(!confirm(`เริ่มปีสิทธิ์ ${y}\n• ล้างวันที่ใช้ไป (ไม่ยกยอดคงเหลือ)\n• สิทธิ์ตั้งต้น: ${m==='def'?'ตามค่าเริ่มต้นของแต่ละประเภท':'คงของเดิมรายบุคคล'}\n`+(pend?`• มี ${pend} ใบที่ยังรออนุมัติ — ควรอนุมัติ/ปฏิเสธก่อน เพราะถ้าอนุมัติหลังนี้จะหักจากสิทธิ์ปีใหม่\n`:'')+'\nระบบจะดาวน์โหลดไฟล์สำรองให้ก่อน ดำเนินการต่อ?'))return;
  exportJson();
  const ap={};DB.requests.forEach(r=>{if(r.status==='appr'&&String(r.from).slice(0,4)===String(y)){const k=r.empId+'|'+r.typeId;ap[k]=(ap[k]||0)+(+r.days||0);}});
  DB.employees.forEach(e=>{e.q=e.q||{};DB.types.forEach(ty=>{const o=e.q[ty.id]||{};
    e.q[ty.id]={...o,quota:m==='def'?(+ty.def||0):(+o.quota||0),used:+(ap[e.id+'|'+ty.id]||0).toFixed(6)};});});
  DB.quotaYear=y;(DB.yearLog=DB.yearLog||[]).push({y,at:new Date().toISOString(),m});save();toast('เริ่มปีสิทธิ์ '+y+' แล้ว');render();}
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function delPeriodCard(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;
  return `<div class="card"><h2>ลบใบลาตามช่วงเวลา</h2>
    <p class="note">ลบใบลาที่ "วันที่เริ่มลา" อยู่ในช่วงที่เลือก (แนะนำให้ส่งออก/สำรองข้อมูลก่อน)</p>
    <div class="grid g3">
      <div class="field"><label>รูปแบบ</label><select id="dp_m" onchange="dpMode()"><option value="range">ช่วงวันที่</option><option value="year">ทั้งปี</option><option value="month">ทั้งเดือน</option></select></div>
      <div class="field" id="dp_r1"><label>จากวันที่</label><input type="date" id="dp_f"></div>
      <div class="field" id="dp_r2"><label>ถึงวันที่</label><input type="date" id="dp_t"></div>
      <div class="field" id="dp_y" style="display:none"><label>ปี</label><select id="dp_yy">${Array.from({length:8},(_,i)=>y-5+i).map(v=>`<option value="${v}"${v===y?' selected':''}>${v} (พ.ศ. ${v+543})</option>`).join('')}</select></div>
      <div class="field" id="dp_mo" style="display:none"><label>เดือน</label><select id="dp_mm">${MONTHS.map((n,i)=>`<option value="${i+1}"${i+1===m?' selected':''}>${n}</option>`).join('')}</select></div></div>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="dp_rs" checked style="width:auto;margin:0"> คืนสิทธิ์วันลาที่หักไปแล้ว (เฉพาะใบที่อนุมัติ)</label>
    <button class="btn bad" onclick="delPeriod()">${t('del')}</button></div>`;}
function dpMode(){const m=$('#dp_m').value,sh=(id,v)=>$(id).style.display=v?'block':'none';
  sh('#dp_r1',m==='range');sh('#dp_r2',m==='range');sh('#dp_y',m!=='range');sh('#dp_mo',m==='month');}
function delPeriod(){const m=$('#dp_m').value;let a,b,txt;
  if(m==='range'){a=$('#dp_f').value;b=$('#dp_t').value;if(!a||!b||a>b){toast('เลือกช่วงวันที่ให้ถูกต้อง');return;}txt=fmtD(a)+' – '+fmtD(b);}
  else{const y=+$('#dp_yy').value;
    if(m==='year'){a=y+'-01-01';b=y+'-12-31';txt='ทั้งปี '+y;}
    else{const mo=+$('#dp_mm').value,mm=String(mo).padStart(2,'0');a=y+'-'+mm+'-01';b=y+'-'+mm+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0');txt=MONTHS[mo-1]+' '+y;}}
  const list=DB.requests.filter(r=>r.from>=a&&r.from<=b);
  if(!list.length){toast(t('none'));return;}
  if(!confirm(`ลบใบลา ${list.length} ใบ (${txt})?\n\n`+t('confirm')))return;
  if($('#dp_rs').checked)list.forEach(r=>{if(r.status==='appr'){const e=empById(r.empId);
    if(e?.q?.[r.typeId])e.q[r.typeId].used=Math.max(0,(+e.q[r.typeId].used||0)-(+r.days||0));}});
  const ids=new Set(list.map(r=>r.id));DB.requests=DB.requests.filter(r=>!ids.has(r.id));
  save();toast(t('deleted')+' ('+list.length+')');render();}
function chgAdmPw(){if($('#sp_old').value!==DB.admin.pw){toast(t('wrongpw'));return;}
  const n=$('#sp_new').value;if(n.length<4){toast('ขั้นต่ำ 4 ตัวอักษร');return;}
  DB.admin.pw=n;save();toast(t('saved'));}
function wipe(w){if(!confirm(t('wipeWarn')+'\n\n'+t('confirm')))return;
  if(w==='req'){DB.requests=[];DB.seq=1;}if(w==='emp')DB.employees=[];if(w==='all')DB=freshDB();
  save();toast(t('deleted'));w==='all'?logout():render();}

/* ============================================================
   Supabase sync — เก็บในเครื่อง (localStorage) + ซิงค์ขึ้น Supabase
   พนักงานและใบลาซิงค์ทีละแถว (หลายคนใช้พร้อมกันไม่ทับกัน), ไม่ลบข้อมูลคลาวด์เองนอกจากผู้ใช้สั่งลบ
   ============================================================ */
const SB={url:'https://ipteomoqgzakztgxpslr.supabase.co',key:'sb_publishable_VR7RNP0FGCcfJsEBFLbEIg_AVDLWVgi'};
const KVK=['types','approvers','admin','holidays','kpi','quotaYear','yearLog','flows','line'];
const SYNC={on:false,busy:false,again:false,tm:null,snap:{emp:{},req:{},kv:{}}};
const jh=o=>JSON.stringify(o);
async function sbq(path,opt={}){const r=await fetch(SB.url+'/rest/v1/'+path,{...opt,headers:{apikey:SB.key,'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));const x=await r.text();return x?JSON.parse(x):null;}
async function sbAll(path){let all=[],from=0;for(;;){const rows=await sbq(path,{headers:{Range:`${from}-${from+999}`,'Range-Unit':'items'}})||[];all=all.concat(rows);if(rows.length<1000)break;from+=1000;}return all;}
function sbStat(m,c){let b=$('#sbStat');if(!b){b=document.createElement('div');b.id='sbStat';b.style.cssText='position:fixed;left:8px;bottom:8px;font-size:12px;padding:3px 9px;border-radius:12px;background:#fff;border:1px solid #d8cbb5;z-index:50';document.body.appendChild(b);}
  b.textContent=m;b.style.color=c||'#6b5a48';}
const snapFrom=R=>{const sn={emp:{},req:{},kv:{}};R.kv.forEach(x=>sn.kv[x.key]=jh(x.value));R.em.forEach(x=>sn.emp[x.id]=jh(x.data));R.rq.forEach(x=>sn.req[x.id]=jh({...x.data,no:x.no}));return sn;};
function syncDiff(){const d={ue:[],ur:[],uk:[],de:[],dr:[]},sn=SYNC.snap,ek=new Set(),rk=new Set();
  DB.employees.forEach(e=>{const k=String(e.id),j=jh(e);ek.add(k);if(sn.emp[k]!==j)d.ue.push({id:k,data:e,j});});
  Object.keys(sn.emp).forEach(k=>{if(!ek.has(k))d.de.push(k);});
  DB.requests.forEach(r=>{const k=String(r.id);rk.add(k);if(sn.req[k]!==jh(r))d.ur.push({id:k,no:(k in sn.req)?r.no:null,data:r});});
  Object.keys(sn.req).forEach(k=>{if(!rk.has(k))d.dr.push(k);});
  KVK.forEach(k=>{if(DB[k]!==undefined&&sn.kv[k]!==jh(DB[k]))d.uk.push({key:k,value:DB[k],j:jh(DB[k])});});return d;}
const dirty=d=>d.ue.length||d.ur.length||d.uk.length||d.de.length||d.dr.length;
function syncApply(R){
  const inPlace=(arr,rows,kf,mk)=>{const m=new Map(arr.map(o=>[String(kf(o)),o]));
    const out=rows.map(r=>{const n=mk(r),o=m.get(String(kf(n)));if(o){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,n);return o;}return n;});arr.length=0;out.forEach(o=>arr.push(o));};
  inPlace(DB.employees,R.em,e=>e.id,r=>r.data);inPlace(DB.requests,R.rq,r=>r.id,r=>({...r.data,no:r.no}));
  R.kv.forEach(x=>{if(!KVK.includes(x.key))return;if(Array.isArray(DB[x.key])&&Array.isArray(x.value)){DB[x.key].length=0;x.value.forEach(v=>DB[x.key].push(v));}else DB[x.key]=x.value;});
  DB.employees.forEach(e=>{if(!SHIFTS[e.shift])e.shift='normal';});
  DB.seq=DB.requests.reduce((a,r)=>Math.max(a,+r.no||0),0)+1;SYNC.snap=snapFrom(R);}
const syncPull=async()=>({kv:await sbAll('app_kv?select=key,value&order=key'),em:await sbAll('app_employees?select=id,data&order=id'),rq:await sbAll('app_requests?select=id,no,data&order=no.asc,id.asc')});
function syncQueue(){if(!SYNC.on)return;clearTimeout(SYNC.tm);SYNC.tm=setTimeout(syncPush,600);}
async function syncPush(){if(!SYNC.on)return;if(SYNC.busy){SYNC.again=true;return;}SYNC.busy=true;
  try{const d=syncDiff(),nDel=d.de.length+d.dr.length,nSnap=Object.keys(SYNC.snap.emp).length+Object.keys(SYNC.snap.req).length;
    if(nDel>20&&nDel>=nSnap*.5&&!confirm(`จะลบ ${nDel} จาก ${nSnap} รายการบน Supabase ยืนยันหรือไม่?\n(กดยกเลิก = ดึงข้อมูลจากคลาวด์กลับมา)`)){syncApply(await syncPull());SYNC.busy=false;render();return;}
    if(dirty(d)){sbStat('☁ กำลังบันทึก…');
      const up=async(tbl,rows,on,after)=>{for(let i=0;i<rows.length;i+=200){const x=await sbq(`${tbl}?on_conflict=${on}`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:jh(rows.slice(i,i+200))});if(after)(x||[]).forEach(after);}};
      await up('app_kv',d.uk.map(x=>({key:x.key,value:x.value})),'key');d.uk.forEach(x=>SYNC.snap.kv[x.key]=x.j);
      await up('app_employees',d.ue.map(x=>({id:x.id,data:x.data})),'id');d.ue.forEach(x=>SYNC.snap.emp[x.id]=x.j);
      await up('app_requests',d.ur.map(x=>({id:x.id,no:x.no,data:x.data})),'id',row=>{const r=DB.requests.find(q=>String(q.id)===row.id);if(r){r.no=row.no;SYNC.snap.req[row.id]=jh(r);}});
      for(const [tbl,ids,key] of [['app_employees',d.de,'emp'],['app_requests',d.dr,'req']])for(let i=0;i<ids.length;i+=100){
        await sbq(`${tbl}?id=in.(${ids.slice(i,i+100).map(x=>'"'+String(x).replace(/"/g,'')+'"').join(',')})`,{method:'DELETE'});ids.slice(i,i+100).forEach(x=>delete SYNC.snap[key][x]);}
      DB.seq=DB.requests.reduce((a,r)=>Math.max(a,+r.no||0),0)+1;try{localStorage.setItem(KEY,jh(DB));}catch(e){}}
    sbStat('☁ ซิงค์แล้ว','#3E7B4F');
  }catch(e){sbStat('☁ ซิงค์ไม่สำเร็จ (จะลองใหม่)','#B5532F');console.error(e);}
  SYNC.busy=false;if(SYNC.again){SYNC.again=false;syncQueue();}}
async function syncTick(){if(!SYNC.on||SYNC.busy)return;if(dirty(syncDiff())){syncPush();return;}
  try{const R=await syncPull();if(dirty(syncDiff()))return;if(jh(snapFrom(R))===jh(SYNC.snap)){sbStat('☁ ซิงค์แล้ว','#3E7B4F');return;}
    syncApply(R);try{localStorage.setItem(KEY,jh(DB));}catch(e){}
    const a=document.activeElement;if(S.role&&S.role!=='emp'&&!$('#er_f')&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))){const y=scrollY;render();scrollTo(0,y);}
    sbStat('☁ อัปเดตจากคลาวด์แล้ว','#3E7B4F');}catch(e){sbStat('☁ ออฟไลน์','#B5532F');}}
async function syncInit(){sbStat('☁ กำลังเชื่อมต่อ Supabase…');
  try{const R=await syncPull(),empty=!R.kv.length&&!R.em.length&&!R.rq.length,hasLocal=DB.employees.length||DB.requests.length,linked=localStorage.getItem('leave_sb_linked');
    if(empty){SYNC.snap={emp:{},req:{},kv:{}};SYNC.on=true;await syncPush();
      toast(`อัปโหลดข้อมูลเดิมขึ้น Supabase แล้ว (พนักงาน ${DB.employees.length} คน, ใบลา ${DB.requests.length} ใบ)`);}
    else if(hasLocal&&!linked&&!confirm('บน Supabase มีข้อมูลอยู่แล้ว\n\nOK = ใช้ข้อมูลบน Supabase (ระบบจะดาวน์โหลดไฟล์สำรองข้อมูลในเครื่องนี้ให้ก่อน)\nยกเลิก = รวมข้อมูลในเครื่องนี้ขึ้นไป (ไม่ลบข้อมูลบน Supabase)')){
      const ie=new Set(DB.employees.map(e=>String(e.id))),ir=new Set(DB.requests.map(r=>String(r.id)));
      R.em.forEach(x=>{if(!ie.has(x.id))DB.employees.push(x.data);});R.rq.forEach(x=>{if(!ir.has(x.id))DB.requests.push({...x.data,no:x.no});});
      SYNC.snap=snapFrom(R);SYNC.on=true;await syncPush();}
    else{if(hasLocal&&!linked)exportJson();syncApply(R);try{localStorage.setItem(KEY,jh(DB));}catch(e){}SYNC.on=true;}
    localStorage.setItem('leave_sb_linked','1');sbStat('☁ ซิงค์แล้ว','#3E7B4F');if(!S.role)render();
    setInterval(syncTick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncTick();});
  }catch(e){sbStat('☁ เชื่อมต่อไม่ได้ — ใช้ข้อมูลในเครื่อง','#B5532F');console.error(e);}}

document.documentElement.lang=lang;
/* ---- ตรวจเวอร์ชันใหม่อัตโนมัติ (เปลี่ยนเลขนี้ทุกครั้งที่ deploy ไฟล์ใหม่) ---- */
const APP_VERSION='2026-10-16.2';
(function updWatch(){
  const tag=document.createElement('div');tag.textContent='v'+APP_VERSION;
  tag.style.cssText='position:fixed;right:8px;bottom:3px;font-size:11px;opacity:.45;pointer-events:none;z-index:5';document.body.appendChild(tag);
  if(!/^https?:/.test(location.protocol))return;
  function show(v){if(document.getElementById('upd_bar'))return;
    const d=document.createElement('div');d.id='upd_bar';
    d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#C62828;color:#fff;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.35)';
    const sp=document.createElement('span');sp.textContent=t('newVer');
    const b=document.createElement('button');b.textContent=t('updNow');
    b.style.cssText='background:#fff;color:#C62828;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer';
    b.onclick=()=>{location.href=location.pathname+'?u='+encodeURIComponent(v);};
    d.append(sp,b);document.body.appendChild(d);}
  async function chk(){try{const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/APP_VERSION\s*=\s*'([^']+)'/);if(m&&m[1]!==APP_VERSION)show(m[1]);}catch(e){}}
  setTimeout(chk,4000);setInterval(chk,600000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk();});
})();
render();syncInit();
</script>
